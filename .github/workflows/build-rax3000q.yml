
name: Build RAX3000Q - ImmortalWrt 25.12

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: immortalwrt-25.12

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git \
            libncurses-dev libssl-dev python3 python3-pip \
            python3-venv python3-setuptools python3-yaml \
            python3-pyelftools python3-docutils rsync \
            unzip zlib1g-dev file wget curl xsltproc \
            qemu-utils device-tree-compiler libelf-dev \
            liblzma-dev zstd

      - name: Update and install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure RAX3000Q
        run: |
          cat > .config <<'EOF'
          CONFIG_TARGET_qualcommax=y
          CONFIG_TARGET_qualcommax_ipq50xx=y
          CONFIG_TARGET_qualcommax_ipq50xx_DEVICE_cmcc_rax3000q=y
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-ssl=y
          CONFIG_PACKAGE_luci-proto-ppp=y
          CONFIG_PACKAGE_ppp-mod-pppoe=y
          EOF

          make defconfig
          grep -q '^CONFIG_TARGET_qualcommax_ipq50xx_DEVICE_cmcc_rax3000q=y' .config

      - name: Download source packages
        run: make -j2 download

      - name: Build firmware
        run: make -j2 V=s

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RAX3000Q-ImmortalWrt-25.12-test
          path: bin/targets/qualcommax/ipq50xx/
          if-no-files-found: error
          retention-days: 14
